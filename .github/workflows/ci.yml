name: CI

# Corre en cada PR (el portón antes de mergear). El push a main lo maneja
# deploy.yml, que vuelve a correr estos checks antes de tocar producción.
on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
